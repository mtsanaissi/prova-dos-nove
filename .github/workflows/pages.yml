name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # --check constrói site/ e roda os critérios 1–4, 6 e 7, a idempotência
      # do 5 e os casos de limite. A metade do critério 5 que roda o 06 é local:
      # data/interim/ está fora do git (.gitignore) e o CI não tem as etapas.
      - run: python scripts/12_build_site.py --public data/public --out site --data-build 2026-11-06 --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
